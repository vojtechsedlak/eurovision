<body>
	<!-- Accessibility: Skip to main content link -->
	<a href="#main-content" class="skip-to-main" aria-label="Skip to main content">Skip to main content</a>
	
	<!-- Main application container with semantic structure -->
	<div id="app">%sveltekit.body%</div>
	
	<!-- Performance: Preload critical resources -->
	<script>
		// Preload critical resources for better performance
		if ('requestIdleCallback' in window) {
			requestIdleCallback(() => {
				// Preload images that might be needed
				const preloadImages = ['/assets/banner.png', '/assets/og.png'];
				preloadImages.forEach(src => {
					const img = new Image();
					img.src = src;
				});
			});
		}
